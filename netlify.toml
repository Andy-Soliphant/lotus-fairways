# Lotus & Fairways — Netlify Configuration

[build]
  publish = "."

# Redirect old YLH pages once we're ready to switch over
# [[redirects]]
#   from = "https://yourluxuryholiday.co.uk/*"
#   to = "https://lotusfairways.com/:splat"
#   status = 301
#   force = true

# Clean URL for journal index
[[redirects]]
  from = "/journal"
  to = "/journal/"
  status = 301

# Headers for performance and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
