<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You — Lotus & Fairways</title>
  <meta name="robots" content="noindex">

  <link rel="stylesheet" href="/css/style.css?v=3">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <style>
    .thankyou-wrap {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-3xl) var(--space-xl);
    }
    .thankyou-inner { max-width: 560px; }
    .thankyou-mark {
      width: 64px;
      height: 64px;
      background: var(--rose-pale);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-xl);
    }
    .thankyou-inner h1 { margin-bottom: var(--space-md); }
    .thankyou-inner p { color: var(--slate); line-height: 1.8; margin-bottom: var(--space-lg); }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QT9QGJB8ET"></script>

  <!-- Crisp Chat -->
  <script type="text/javascript">
    window.$crisp=[];
    window.CRISP_WEBSITE_ID="46bc36a3-c147-4baa-9228-b066166829d2";
    (function(){

<body>

<script src="/components/nav.js?v=2"></script>

<div class="thankyou-wrap">
  <div class="thankyou-inner">
    <div class="thankyou-mark">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#9b3a5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div class="eyebrow" style="color:var(--bronze);">— Enquiry Received —</div>
    <h1>Thank you for getting in touch.</h1>
    <p>We've received your enquiry and will come back to you within one working day. If your travel dates are soon or you have an urgent question, please call us on <a href="tel:+441625802142" style="color:var(--rose);">01625 802142</a>.</p>

    <a href="/" class="btn btn-rose">Return to Homepage →</a>
  </div>
</div>

<script src="/components/footer.js?v=2"></script>
<script src="/js/main.js"></script>

</html>
